<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestador · Herramienta para oficios</title>
    <style>
        /* Mantenemos tus estilos intactos */
        /* ... (tus estilos actuales) ... */
    </style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
    <div class="lock-box">
        <div class="lock-icon">🔒</div>
        <h2>Tu período de prueba terminó</h2>
        <p id="lockMsg">Para seguir usando el Presupuestador, escribinos y te activamos el acceso.</p>
        <a id="lockWhatsapp" class="btn btn-primary" href="#" target="_blank" rel="noopener">📲 Activar mi acceso por WhatsApp</a>
    </div>
</div>

<script>
/* CONFIGURACIÓN */
const CONFIG = {
    nombre: "El Tony — Electricidad y Aire Acondicionado",
    rubro: "Electricidad & Aire Acondicionado",
    whatsapp: "5492364316208",
    catalogCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQE_h9cyHLsFA1ZTrd12YmXvjyuGLCJrXAoL6fLp2cjE5Ml-1sEReQzANjx7B59iX7zsvEsITn2_MY/pub?output=csv",
    scriptUrl: "https://script.google.com/macros/s/AKfycbzsd4EaYQXZ_ufO_AYho8kF4iT60AHURiEj-rUjMjiox3bHYZs-oP5h9UT1aSP3STmPYA/exec",
    catalogPin: "0612"
};

/* CHEQUEO DE LICENCIA */
async function chequearLicencia() {
    try {
        const res = await fetch(CONFIG.scriptUrl);
        const data = await res.json();
        
        // Si el script responde activo: true, dejamos pasar
        if (data.activo === true) {
            return true;
        }

        // Si llega acá, es porque activo es false o null
        const msg = data.vence ? `Tu acceso vence el ${data.vence}.` : "Acceso desactivado.";
        document.getElementById("lockMsg").textContent = msg;
        document.getElementById("lockWhatsapp").href = `https://wa.me/${CONFIG.whatsapp}?text=Hola,%20quiero%20activar%20mi%20acceso%20al%20Presupuestador.`;
        document.getElementById("lockOverlay").classList.add("open");
        return false;

    } catch (err) {
        console.warn("No se pudo conectar con el servidor de licencias, permitiendo acceso por seguridad.");
        return true;
    }
}

// Inicialización corregida: corre el chequeo y si es true, carga el resto
(async () => {
    const habilitado = await chequearLicencia();
    if (habilitado) {
        // Acá llamarías a tus funciones de carga (cargarCatalogo, etc.)
        console.log("Acceso concedido");
    }
})();
</script>
</body>
</html>
