<script>
/* ================== CONFIGURACIÓN ================== */
const CONFIG = {
  nombre: "El Tony — Electricidad y Aire Acondicionado",
  rubro: "Electricidad & Aire Acondicionado",
  whatsapp: "5492364316208",
  catalogCsvUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRQE_h9cyHLsFA1ZTrd12YmXvjyuGLCJrXAoL6fLp2cjE5Ml-1sEReQzANjx7B59iX7zsvEsITn2_MY/pub?output=csv",
  scriptUrl: "https://script.google.com/macros/s/AKfycbzsd4EaYQXZ_ufO_AYho8kF4iT60AHURiEj-rUjMjiox3bHYZs-oP5h9UT1aSP3STmPYA/exec",
  catalogPin: "0612"
};

/* ================== CHEQUEO DE LICENCIA (CORREGIDO) ================== */
async function chequearLicencia(){
  if(!CONFIG.scriptUrl) return true;

  try{
    // Cambiado a GET para que funcione con tu doGet en Apps Script
    const res = await fetch(CONFIG.scriptUrl); 
    const data = await res.json();
    
    // Si activo no es true, bloqueamos
    if(data.activo !== true){
      const msg = data.vence ? `Tu acceso vence el ${data.vence}.` : "Acceso desactivado.";
      document.getElementById("lockMsg").textContent = msg;
      document.getElementById("lockWhatsapp").href = 
        `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent("Hola, quiero activar mi acceso.")}`;
      document.getElementById("lockOverlay").classList.add("open");
      return false;
    }
    return true;
  } catch(err){
    console.warn("Error de conexión, permitiendo acceso:", err);
    return true;
  }
}

// Inicialización de toda la lógica de la web
(async ()=>{
  const habilitado = await chequearLicencia();
  if(habilitado) {
    // Si la licencia es válida, inicializamos todo lo demás
    cargarCatalogo();
    renderTicket();
  }
})();

// ... (PEGÁ EL RESTO DE TU SCRIPT ORIGINAL ACÁ) ...
</script>
